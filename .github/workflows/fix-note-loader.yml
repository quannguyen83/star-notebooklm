name: Fix NotebookLM note loader

on:
  push:
    branches: [fix-note-loader-temp]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-note-loader-temp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch
        run: python scripts/fix_note_loader.py
      - name: Build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Commit implementation
        run: |
          rm -f .github/workflows/fix-note-loader.yml scripts/fix_note_loader.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore NotebookLM note loading"
          git push origin HEAD:fix-note-loader-temp
