name: Patch save modes
on:
  push:
    branches: [feature-download-separate-save-temp]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch source
        run: python .github/scripts/patch_save_modes.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          rm -f .github/workflows/patch-save-modes.yml .github/scripts/patch_save_modes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: download NotebookLM outputs and support separate saves"
          git push
