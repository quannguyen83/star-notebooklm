name: Patch artifact API validation
on:
  push:
    branches:
      - fix-artifact-validation-temp
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch
        run: python scripts/patch_artifact_api.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          rm -f .github/workflows/patch-artifact-api-validation.yml scripts/patch_artifact_api.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: validate NotebookLM artifacts before import"
          git push
