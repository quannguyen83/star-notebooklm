name: Patch note output separation
on:
  push:
    branches:
      - fix-artifact-validation-temp
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix patch replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/patch_note_output.py')
          s = p.read_text(encoding='utf-8')
          old = "s = pat.sub(new_func + '\\n\\n\\tsanitizeNotebookLMText', s, count=1)"
          new = "s = pat.sub(lambda _m: new_func + '\\n\\n\\tsanitizeNotebookLMText', s, count=1)"
          if old not in s:
              raise SystemExit('replacement line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Patch source
        run: python .github/scripts/patch_note_output.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/patch-note-output-separation.yml
          rm -f .github/scripts/patch_note_output.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts main.js manifest.json .github
          git commit -m "fix: separate NotebookLM notes from generated outputs"
          git push
